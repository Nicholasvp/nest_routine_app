name: nestroutine
description: "Beautiful baby routine tracking app."
publish_to: 'none'
version: 1.6.0+9

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  collection: ^1.19.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0
  permission_handler: ^11.0.0
  purchases_flutter: ^9.8.0
  purchases_ui_flutter: ^9.8.0
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^5.2.0
  package_info_plus: ^8.1.3
  flutter_animate: ^4.5.0
  in_app_review: ^2.0.9
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/nest_routine_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/nest_routine_logo.png
