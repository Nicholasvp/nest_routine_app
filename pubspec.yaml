name: nestroutine
description: "Beautiful baby routine tracking app."
publish_to: 'none'
version: 1.10.0+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  provider: ^6.1.2
  intl: ^0.20.3
  fl_chart: ^1.2.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  collection: ^1.19.0
  flutter_local_notifications: ^22.2.0
  timezone: ^0.11.0
  permission_handler: ^13.0.2
  purchases_flutter: ^10.15.2
  purchases_ui_flutter: ^10.15.2
  supabase_flutter: ^2.8.0
  flutter_dotenv: ^6.0.1
  crypto: ^3.0.6
  sign_in_with_apple: ^8.2.0
  package_info_plus: ^10.2.2
  flutter_animate: ^4.5.0
  in_app_review: ^2.0.9
  url_launcher: ^6.2.0
  facebook_app_events: ^0.30.5
  app_tracking_transparency: ^2.0.7
  google_fonts: ^8.2.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/nest_routine_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/nest_routine_logo.png
    - assets/google_g_logo.svg
